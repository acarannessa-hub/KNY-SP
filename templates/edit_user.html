<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User - KNY-SP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/private.css') }}">
</head>
<body>
    {% include "private_header.html" %}
    <main class="private-container">
        <a class="back" href="{{ url_for('manage_users') }}">← Back to User Management</a>
        <header class="page-heading">
            <h1>Edit User</h1>
            <p>Update account details, role, and access status.</p>
        </header>

        <section class="card user-form-card">
            <form method="POST">
                <div class="form-field">
                    <label for="full_name">Full Name</label>
                    <input type="text" id="full_name" name="full_name" value="{{ user.full_name }}" required>
                </div>
                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" value="{{ user.email }}" required>
                </div>
                <div class="form-grid">
                    <div class="form-field">
                        <label for="role">Role</label>
                        <select id="role" name="role">
                            <option value="admin" {% if user.role == "admin" %}selected{% endif %}>Admin</option>
                            <option value="encoder" {% if user.role == "encoder" %}selected{% endif %}>Encoder</option>
                            <option value="member" {% if user.role == "member" %}selected{% endif %}>Member</option>
                            <option value="viewer" {% if user.role == "viewer" %}selected{% endif %}>Viewer</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label for="status">Status</label>
                        <select id="status" name="status">
                            <option value="active" {% if user.status == "active" %}selected{% endif %}>Active</option>
                            <option value="inactive" {% if user.status == "inactive" %}selected{% endif %}>Inactive</option>
                        </select>
                    </div>
                </div>
                <div class="user-form-actions">
                    <a class="btn btn-secondary" href="{{ url_for('manage_users') }}">Cancel</a>
                    <button class="btn btn-primary" type="submit">Save Changes</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
