<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password - KNY-SP</title>

    <style>

        body {

            font-family: Arial, sans-serif;

            background: #f5f5f5;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

            margin: 0;
        }

        .box {

            width: 380px;

            background: white;

            padding: 35px;

            border-radius: 10px;

            box-shadow:
                0 3px 12px
                rgba(0, 0, 0, 0.12);
        }

        h1 {

            color: #800000;
        }

        .subtitle {

            color: #666;

            margin-bottom: 25px;
        }

        label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;
        }

        input {

            width: 100%;

            box-sizing: border-box;

            padding: 11px;

            margin-bottom: 18px;

            border: 1px solid #ccc;

            border-radius: 5px;
        }

        button {

            width: 100%;

            padding: 12px;

            background: #800000;

            color: white;

            border: none;

            border-radius: 5px;

            cursor: pointer;

            font-size: 15px;
        }

        button:hover {

            background: #600000;
        }

        .message {

            padding: 10px;

            margin-bottom: 15px;

            border-radius: 5px;

        }

        .success {

            background: #d1e7dd;

            color: #0f5132;
        }

        .error {

            background: #f8d7da;

            color: #842029;
        }

        .back {

            display: block;

            text-align: center;

            margin-top: 15px;

            color: #800000;

            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="box">

    <h1>Forgot Password?</h1>

    <p class="subtitle">
        Enter your registered email and an administrator can help reset your password.
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% for category, message in messages %}

            <div class="message {{ category }}">
                {{ message }}
            </div>

        {% endfor %}

    {% endwith %}

    <form method="POST">

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your registered email"
            required
        >

        <button type="submit">
            Request Password Reset
        </button>

    </form>

    <a
        href="{{ url_for('login') }}"
        class="back"
    >
        Back to Login
    </a>

</div>

</body>
</html>
