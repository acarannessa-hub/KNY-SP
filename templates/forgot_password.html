<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - KNY-SP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/private.css') }}">
</head>
<body>
    <main class="auth-page">
        <section class="auth-box">
            <div class="auth-brand">
                <span class="auth-brand-mark">KNY</span>
                <span>Kaya Natin! Youth</span>
            </div>
            <h1>Forgot Password?</h1>
            <p class="subtitle">Enter your registered email and an administrator can help reset your password.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                <div class="message {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST">
                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your registered email" autocomplete="email" required>
                </div>
                <button class="btn btn-primary" type="submit">Request Password Reset</button>
            </form>

            <a href="{{ url_for('login') }}" class="back">Back to Login</a>
        </section>
    </main>
</body>
</html>
