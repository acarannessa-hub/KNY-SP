<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - KNY-SP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/private.css') }}">
</head>
<body>
    <main class="auth-page">
        <section class="auth-box">
            <div class="auth-brand">
                <span class="auth-brand-mark">KNY</span>
                <span>Kaya Natin! Youth</span>
            </div>
            <h1>Welcome back</h1>
            <p class="subtitle">Sign in to the KNY-SP Transparency and Financial Monitoring System.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                <div class="message {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST">
                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="username" required>
                </div>
                <div class="form-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                </div>
                <button class="btn btn-primary" type="submit">Login</button>
            </form>

            <a href="{{ url_for('forgot_password') }}" class="forgot-password">Forgot Password?</a>
        </section>
    </main>
</body>
</html>
