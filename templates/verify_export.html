<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Verify Export - KNY-SP</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 450px;
            margin: 80px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;

            box-shadow:
                0 3px 12px rgba(0,0,0,0.10);
        }

        h2 {
            color: #800000;
            margin-top: 0;
        }

        p {
            color: #666;
            line-height: 1.5;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;

            border: 1px solid #ccc;
            border-radius: 5px;

            margin-bottom: 20px;
        }

        button {
            width: 100%;

            padding: 11px;

            background: #800000;
            color: white;

            border: none;
            border-radius: 5px;

            cursor: pointer;

            font-weight: bold;
        }

        button:hover {
            background: #600000;
        }

        .back {
            display: block;

            margin-top: 15px;

            text-align: center;

            color: #800000;

            text-decoration: none;
        }

        .message {
            padding: 10px;

            margin-bottom: 15px;

            border-radius: 5px;

            background: #f8d7da;

            color: #842029;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h2>
            Verify Your Identity
        </h2>

        <p>
            For security, please enter your password
            again before downloading the financial
            export.
        </p>


        {% with messages =
            get_flashed_messages(
                with_categories=true
            )
        %}

            {% for category, message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endwith %}


        <form
            method="POST"
            action="{{ url_for('verify_admin_export') }}"
        >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                required
                autofocus
            >


            <button type="submit">
                Verify and Continue
            </button>

        </form>


        <a
            class="back"
            href="{{ url_for('financial_management') }}"
        >
            Cancel
        </a>

    </div>

</div>

</body>

</html>
