<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - KNY-SP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/private.css') }}">
</head>
<body>
    {% include "private_header.html" %}
    <main class="auth-page auth-page-compact">
        <section class="auth-box">
            <div class="auth-brand">
                <span class="auth-brand-mark">KNY</span>
                <span>Kaya Natin! Youth</span>
            </div>
            <h1>Change Password</h1>
            <p class="subtitle">Change the password for <strong>{{ current_user.email }}</strong>.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                <div class="message {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST">
                <div class="form-field">
                    <label for="current_password">Current Password</label>
                    <input type="password" id="current_password" name="current_password" autocomplete="current-password" required>
                </div>
                <div class="form-field">
                    <label for="new_password">New Password</label>
                    <input type="password" id="new_password" name="new_password" autocomplete="new-password" minlength="8" required>
                </div>
                <div class="form-field">
                    <label for="confirm_password">Confirm New Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" minlength="8" required>
                </div>
                <button class="btn btn-primary" type="submit">Change Password</button>
            </form>

            <a class="back" href="{{ url_for('dashboard') }}">← Back to Dashboard</a>
        </section>
    </main>
</body>
</html>
