<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Change Password - KNY-SP</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            margin: 0;
        }

        .box {
            width: 400px;
            background: white;

            padding: 35px;

            border-radius: 10px;

            box-shadow:
                0 3px 12px rgba(0,0,0,0.12);
        }

        h1 {
            color: #800000;
            margin-top: 0;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;

            padding: 11px;
            margin-bottom: 18px;

            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;

            padding: 12px;

            background: #800000;
            color: white;

            border: none;
            border-radius: 5px;

            cursor: pointer;
        }

        button:hover {
            background: #600000;
        }

        .message {
            padding: 10px;
            margin-bottom: 15px;

            background: #d1e7dd;
            color: #0f5132;

            border-radius: 5px;
        }

        .danger {
            background: #f8d7da;
            color: #842029;
        }

        .back {
            display: block;
            margin-top: 20px;

            text-align: center;

            color: #800000;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="box">

    <h1>
        Change Password
    </h1>

    <p>
        Change the password for
        <strong>{{ current_user.email }}</strong>.
    </p>


    {% with messages = get_flashed_messages(with_categories=true) %}

        {% for category, message in messages %}

            <div class="message
                {% if category == 'danger' %}
                danger
                {% endif %}">

                {{ message }}

            </div>

        {% endfor %}

    {% endwith %}


    <form method="POST">

        <label for="current_password">
            Current Password
        </label>

        <input
            type="password"
            id="current_password"
            name="current_password"
            required
        >


        <label for="new_password">
            New Password
        </label>

        <input
            type="password"
            id="new_password"
            name="new_password"
            minlength="8"
            required
        >


        <label for="confirm_password">
            Confirm New Password
        </label>

        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            minlength="8"
            required
        >


        <button type="submit">
            Change Password
        </button>

    </form>


    <a
        class="back"
        href="{{ url_for('dashboard') }}"
    >
        ← Back to Dashboard
    </a>

</div>

</body>

</html>
