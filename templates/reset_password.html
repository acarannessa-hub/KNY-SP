<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - KNY-SP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/private.css') }}">
</head>
<body>
    <main class="auth-page">
        <section class="auth-box">
            <div class="auth-brand">
                <span class="auth-brand-mark">KNY</span>
                <span>Kaya Natin! Youth</span>
            </div>
            <h1>Reset Password</h1>
            <p class="subtitle">Create a new password for your KNY-SP account.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                <div class="message {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST">
                <div class="form-field">
                    <label for="password">New Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter new password" autocomplete="new-password" minlength="8" required>
                </div>
                <div class="form-field">
                    <label for="confirm_password">Confirm New Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm new password" autocomplete="new-password" minlength="8" required>
                </div>
                <button class="btn btn-primary" type="submit">Reset Password</button>
            </form>
        </section>
    </main>
</body>
</html>
