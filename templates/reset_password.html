<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password - KNY-SP</title>

    <style>

        body {

            font-family: Arial, sans-serif;

            background: #f5f5f5;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

            margin: 0;
        }

        .box {

            width: 380px;

            background: white;

            padding: 35px;

            border-radius: 10px;

            box-shadow:
                0 3px 12px
                rgba(0, 0, 0, 0.12);
        }

        h1 {

            color: #800000;
        }

        .subtitle {

            color: #666;

            margin-bottom: 25px;
        }

        label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;
        }

        input {

            width: 100%;

            box-sizing: border-box;

            padding: 11px;

            margin-bottom: 18px;

            border: 1px solid #ccc;

            border-radius: 5px;
        }

        button {

            width: 100%;

            padding: 12px;

            background: #800000;

            color: white;

            border: none;

            border-radius: 5px;

            cursor: pointer;

            font-size: 15px;
        }

        button:hover {

            background: #600000;
        }

        .message {

            padding: 10px;

            margin-bottom: 15px;

            border-radius: 5px;
        }

        .error {

            background: #f8d7da;

            color: #842029;
        }

    </style>

</head>

<body>

<div class="box">

    <h1>Reset Password</h1>

    <p class="subtitle">
        Create a new password for your KNY-SP account.
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% for category, message in messages %}

            <div class="message {{ category }}">
                {{ message }}
            </div>

        {% endfor %}

    {% endwith %}

    <form method="POST">

        <label for="password">
            New Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter new password"
            minlength="8"
            required
        >

        <label for="confirm_password">
            Confirm New Password
        </label>

        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            placeholder="Confirm new password"
            minlength="8"
            required
        >

        <button type="submit">
            Reset Password
        </button>

    </form>

</div>

</body>
</html>
