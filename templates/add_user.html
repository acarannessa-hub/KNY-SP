<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add User - KNY-SP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/private.css') }}">
</head>
<body>
    {% include "private_header.html" %}
    <main class="private-container">
        <a class="back" href="{{ url_for('manage_users') }}">← Back to User Management</a>
        <header class="page-heading">
            <h1>Add User</h1>
            <p>Create an account and assign its KNY-SP access level.</p>
        </header>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <div class="message {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <section class="card user-form-card">
            <form method="POST">
                <div class="form-field">
                    <label for="full_name">Full Name</label>
                    <input type="text" id="full_name" name="full_name" required>
                </div>
                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-field">
                    <label for="password">Temporary Password</label>
                    <input type="password" id="password" name="password" minlength="8" required>
                </div>
                <div class="form-grid">
                    <div class="form-field">
                        <label for="role">Role</label>
                        <select id="role" name="role">
                            <option value="admin">Admin</option>
                            <option value="encoder">Encoder</option>
                            <option value="member">Member</option>
                            <option value="viewer" selected>Viewer</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label for="status">Status</label>
                        <select id="status" name="status">
                            <option value="active" selected>Active</option>
                            <option value="inactive">Inactive</option>
                        </select>
                    </div>
                </div>
                <div class="user-form-actions">
                    <a class="btn btn-secondary" href="{{ url_for('manage_users') }}">Cancel</a>
                    <button class="btn btn-primary" type="submit">Create User</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
